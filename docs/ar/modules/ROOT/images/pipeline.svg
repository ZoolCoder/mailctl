<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 150" width="830" height="150" font-size="15">
  <title>كل أمر يحمّل ملف الإعداد ويقرأ الحالة الحية ويحدد السجلات المطلوبة ثم يقارن ويرتّب الإجراءات، فيطبعها plan وينفّذها apply</title>
  <defs>
