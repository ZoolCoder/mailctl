  <g text-anchor="middle" font-family="system-ui,sans-serif">
    <text class="d-text" x="768" y="72" fill="#131A27" font-weight="600">التحميل</text>
    <text class="d-code" x="768" y="92" fill="#2563EB" font-size="12" font-family="ui-monospace,Menlo,monospace">mailctl.yaml</text>
    <text class="d-text" x="638" y="72" fill="#131A27" font-weight="600">القراءة</text>
    <text class="d-sub" x="638" y="92" fill="#46566D" font-size="12">الحالة الحية</text>
    <text class="d-text" x="508" y="72" fill="#131A27" font-weight="600">المطلوب</text>
    <text class="d-sub" x="508" y="92" fill="#46566D" font-size="12">السجلات اللازمة</text>
