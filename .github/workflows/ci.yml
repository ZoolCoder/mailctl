name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        # gofmt exits 0 even when it has complaints, so the output is the signal.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Runs as an action rather than a `tool` directive in go.mod: a tool
      # directive would add golangci-lint to the module's direct requirements
      # and break the dependency check below, which is the whole point of
      # that check.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned to the version the config was written and verified against,
          # so a new release cannot turn a green branch red on its own.
          version: v2.12.2

      - name: build
        run: go build ./...

      # -count=1 defeats the test cache, so a green run means the tests actually
      # executed rather than being replayed from a previous one.
      - name: test
        run: go test -count=1 ./...

      - name: test with the race detector
        run: go test -count=1 -race ./...

      - name: verify the dependency set has not grown
        # The project deliberately has exactly two non-stdlib dependencies: the
        # YAML parser and the zcadmin shell. A new one is a design decision, not
        # something that should arrive unnoticed in a pull request.
        run: |
          count=$(go list -deps ./... | grep -c '^gopkg.in/\|^github.com/\|^golang.org/x/' || true)
          echo "non-stdlib packages in the dependency graph: $count"
          go list -m all | tail -n +2 | sed 's/^/  /'
          direct=$(go list -m -f '{{if not .Indirect}}{{.Path}}{{end}}' all | tail -n +2 | grep -v '^$' | wc -l | tr -d ' ')
          if [ "$direct" -ne 2 ]; then
            echo "::error::expected exactly 2 direct dependencies, found $direct"
            go list -m -f '{{if not .Indirect}}{{.Path}}{{end}}' all | tail -n +2
            exit 1
          fi

      - name: verify go.mod is tidy
        run: |
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          diff -u go.mod.bak go.mod || { echo "::error::go.mod is not tidy"; exit 1; }
          diff -u go.sum.bak go.sum || { echo "::error::go.sum is not tidy"; exit 1; }
