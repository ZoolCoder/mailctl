version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # The module deliberately has one direct dependency. A bump should be a
    # visible, reviewed event rather than an automatic one.
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The npm tree is the documentation toolchain only; it ships in no binary.
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
